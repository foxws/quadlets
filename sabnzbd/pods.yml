# How Pods (https://github.com/foxws/pods) offers and installs this application.
version: 1
name: sabnzbd
label: SABnzbd
description: Usenet download client with a web UI
author: francoism90
icon: i-lucide-download
category: Downloads
website: https://sabnzbd.org
repository: https://github.com/sabnzbd/sabnzbd
notes: Binds ~/Downloads/usenet from the host, relabeled for SELinux (change Device= in sabnzbd-downloads.volume; the directory must exist). Uses the host network; the web UI listens on port 8080.
