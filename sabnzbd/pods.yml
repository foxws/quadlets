# How Pods (https://github.com/foxws/pods) offers and installs this application.
version: 1
name: sabnzbd
label: SABnzbd
description: Usenet download client with a web UI
author: francoism90
icon: i-lucide-download
category: Downloads
website: https://sabnzbd.org
repository: https://github.com/sabnzbd/sabnzbd
notes: Binds ~/Downloads/usenet from the host, relabeled for SELinux (the directory must exist; to use another, set Device= in a drop-in such as sabnzbd-downloads.volume.d/path.conf). Uses the host network; the web UI listens on port 8080.
