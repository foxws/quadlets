# How Pods (https://github.com/foxws/pods) offers and installs this application.
version: 1
name: qbittorrent
label: qBittorrent
description: Torrent client with a web UI
author: francoism90
icon: i-lucide-download
category: Downloads
website: https://www.qbittorrent.org
repository: https://github.com/qbittorrent/qBittorrent
notes: Binds ~/Downloads/torrents from the host, relabeled for SELinux (the directory must exist; to use another, set Device= in a drop-in such as qbittorrent-downloads.volume.d/path.conf). Uses the host network; the web UI listens on port 8090.
